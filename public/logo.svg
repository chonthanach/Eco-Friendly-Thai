<svg viewBox="0 0 260 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 4 Arrows Gradients matching the official EFT colors -->
    <linearGradient id="eft-arrow-top" x1="20" y1="20" x2="180" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#78C63E" />
      <stop offset="50%" stopColor="#55A82E" />
      <stop offset="100%" stopColor="#368924" />
    </linearGradient>
    <linearGradient id="eft-arrow-right" x1="180" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6EBF37" />
      <stop offset="100%" stopColor="#2E7E20" />
    </linearGradient>
    <linearGradient id="eft-arrow-bottom" x1="180" y1="180" x2="20" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#5EB135" />
      <stop offset="100%" stopColor="#2B771E" />
    </linearGradient>
    <linearGradient id="eft-arrow-left" x1="20" y1="180" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4CA329" />
      <stop offset="100%" stopColor="#7BC840" />
    </linearGradient>
    
    <!-- Central Diamond Gradient -->
    <linearGradient id="eft-diamond-grad" x1="50" y1="50" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0E6B4B" />
      <stop offset="50%" stopColor="#0B563C" />
      <stop offset="100%" stopColor="#073B29" />
    </linearGradient>
  </defs>

  <!-- Group centered horizontally: offset by 30 to center in 260 width -->
  <g transform="translate(30, 0)">
    <!-- Top Arrow -->
    <path d="M 28 30 L 138 30 L 138 12 L 176 44 L 138 76 L 138 58 L 56 58 L 56 30 Z" fill="url(#eft-arrow-top)" stroke="#205B1B" stroke-width="1.8" />
    <!-- Right Arrow -->
    <path d="M 170 26 L 170 136 L 188 136 L 156 174 L 124 136 L 142 136 L 142 54 L 170 54 Z" fill="url(#eft-arrow-right)" stroke="#1A4F16" stroke-width="1.8" />
    <!-- Bottom Arrow -->
    <path d="M 174 166 L 64 166 L 64 184 L 26 152 L 64 120 L 64 138 L 146 138 L 146 166 Z" fill="url(#eft-arrow-bottom)" stroke="#164613" stroke-width="1.8" />
    <!-- Left Arrow -->
    <path d="M 30 170 L 30 60 L 12 60 L 44 22 L 76 60 L 58 60 L 58 142 L 30 142 Z" fill="url(#eft-arrow-left)" stroke="#1F581A" stroke-width="1.8" />

    <!-- Central Diamond (Rotated Square 45 deg) -->
    <g transform="rotate(45 100 98)">
      <rect x="63" y="61" width="74" height="74" rx="4" fill="url(#eft-diamond-grad)" stroke="#8AE0B3" stroke-width="2.5" stroke-opacity="0.8" />
    </g>

    <!-- EFT Letters -->
    <g id="eft-letters">
      <path d="M 64 84 L 82 84 M 64 98 L 78 98 M 64 112 L 82 112 M 64 84 L 64 112" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square" />
      <path d="M 91 84 L 109 84 M 91 98 L 105 98 M 91 84 L 91 112" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square" />
      <path d="M 118 84 L 138 84 M 128 84 L 128 112" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square" />
    </g>
  </g>

  <!-- Bottom Brand Text -->
  <text 
    x="130" 
    y="198" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="14.5" 
    font-weight="900" 
    letter-spacing="0.08em" 
    fill="#1B5E38"
  >
    ECO FRIENDLY THAI CO., LTD.
  </text>
</svg>
